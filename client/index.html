    <!-- Brand faces: Zilla Slab for headings (it matches the blocky lettering in

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap"

    <link rel="manifest" href="/manifest.webmanifest" />
